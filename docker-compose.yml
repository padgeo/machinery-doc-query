services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333" # REST + web dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC -- this is what qdrant-client / QDRANT_URL talks to
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
